name: phonebook

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Credentials for the two databases created by infra/postgres/init-databases.sh
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      APP_DB: ${APP_DB:-phonebook}
      APP_DB_USER: ${APP_DB_USER:-phonebook}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-phonebook}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} && psql -U $${POSTGRES_USER} -lqt | cut -d '|' -f1 | grep -qw $${APP_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Tokens are always issued for the public URL (the one the browser sees),
      # while containers may still reach Keycloak internally via http://keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/phonebook-realm.json:/opt/keycloak/data/import/phonebook-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget, so query the management port with bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    # Published by CI (.github/workflows/ci.yml); `docker compose up --build` builds it from ./backend instead.
    image: ghcr.io/dmitriithoughtsdotgov/phonebook-backend:latest
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB:-phonebook}
      DB_USER: ${APP_DB_USER:-phonebook}
      DB_PASSWORD: ${APP_DB_PASSWORD:-phonebook}
      # "iss" claim uses the public URL; signing keys are fetched over the internal network.
      KEYCLOAK_ISSUER: http://localhost:8080/realms/phonebook
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/phonebook/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: phonebook-backend
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    # Published by CI (.github/workflows/ci.yml); `docker compose up --build` builds it from ./frontend instead.
    image: ghcr.io/dmitriithoughtsdotgov/phonebook-frontend:latest
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-please-change-me-in-env-file-0123456789}
      KEYCLOAK_CLIENT_ID: phonebook-frontend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-phonebook-frontend-secret}
      # Browser-facing issuer vs. the one the Next.js server can reach inside the network.
      KEYCLOAK_ISSUER: http://localhost:8080/realms/phonebook
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/phonebook
      BACKEND_URL: http://backend:8081
    ports:
      - "3000:3000"
    depends_on:
      keycloak:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres-data:
